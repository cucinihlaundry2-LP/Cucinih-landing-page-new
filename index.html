<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUCINIH — Laundry Modern, Bersih & Wangi</title>
  <meta name="description" content="Laundry modern kiloan, sepatu, tas, dan helm. Antar-jemput gratis, detergen ramah lingkungan, dan tracking via WhatsApp. Grand Launching segera!" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT: '#0EA5E9', light: '#38BDF8', dark: '#0284C7' },
            accent:    { DEFAULT: '#10B981', light: '#34D399' },
            highlight: '#F97316',
            surface:   '#F8FAFC',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* smooth underline nav link */
    .nav-link::after {
      content: '';
      display: block;
      height: 2px;
      width: 0;
      background: #0EA5E9;
      transition: width .25s ease;
    }
    .nav-link:hover::after { width: 100%; }

    /* gradient hero text */
    .gradient-text {
      background: linear-gradient(135deg, #0EA5E9 0%, #10B981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* blob background */
    .hero-bg {
      background: radial-gradient(ellipse 80% 60% at 50% -10%, #e0f2fe 0%, transparent 70%),
                  radial-gradient(ellipse 40% 40% at 90% 80%, #d1fae5 0%, transparent 60%),
                  #f8fafc;
    }

    /* card hover lift */
    .card-lift { transition: transform .2s ease, box-shadow .2s ease; }
    .card-lift:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(14,165,233,.12); }

    /* FAQ answer transition */
    .faq-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
    .faq-body.open { max-height: 200px; }

    /* tab underline */
    .tab-btn.active {
      color: #0EA5E9;
      border-bottom-color: #0EA5E9;
    }

    /* pulse badge */
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(249,115,22,.4); }
      70%  { box-shadow: 0 0 0 10px rgba(249,115,22,0); }
      100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); }
    }
    .pulse-ring { animation: pulse-ring 2s infinite; }
  </style>
</head>
<body class="font-sans bg-surface text-slate-700 antialiased">
